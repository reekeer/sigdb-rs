name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  SIGDB_PY: "3.0.0"
  SIGDB_TS_REF: 7e6ece6dd148d34e991e608d0f72228eef6b8995
  CASES: "1000"
  PYTHONHASHSEED: "0"

jobs:
  build:
    name: build (${{ matrix.impl }})
    runs-on: reekeer-linux
    strategy:
      fail-fast: false
      matrix:
        impl: [python, rust, ts]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: {python-version: "3.13"}
      - name: cases
        run: |
          py() { uv run --no-project --with "sigdb==$SIGDB_PY" python "$@"; }
          py scripts/crosscheck.py cases/full --cases "$CASES" --seed "$GITHUB_RUN_NUMBER"
          py scripts/crosscheck.py cases/portable --cases "$CASES" --seed "$GITHUB_RUN_NUMBER" --no-new-unicode

      - name: python
        if: matrix.impl == 'python'
        run: uv run --no-project --with "sigdb==$SIGDB_PY" python scripts/py_fixtures.py --check

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.impl == 'rust'
        with: {components: "rustfmt, clippy"}
      - name: rust
        if: matrix.impl == 'rust'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo run --release --example crosscheck -- cases/full
          cargo run --release --example crosscheck -- cases/portable

      - uses: actions/checkout@v7
        if: matrix.impl == 'ts'
        with: {repository: reekeer/sigdb-ts, ref: "${{ env.SIGDB_TS_REF }}", path: sigdb-ts}
      - uses: actions/setup-node@v7
        if: matrix.impl == 'ts'
        with: {node-version: 22}
      - uses: oven-sh/setup-bun@v2
        if: matrix.impl == 'ts'
      - name: ts
        if: matrix.impl == 'ts'
        run: |
          (cd sigdb-ts && npm ci && npm run typecheck && npm test)
          SIGDB_TS=sigdb-ts bun scripts/crosscheck-ts.ts cases/portable

      - name: keep this implementation's files
        run: |
          case "${{ matrix.impl }}" in
            python) find cases -name rs.sigdb -o -name ts.sigdb | xargs -r rm ;;
            rust) find cases -type f ! -name rs.sigdb -delete ;;
            ts) find cases -type f ! -name ts.sigdb -delete ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: cases-${{ matrix.impl }}
          path: cases/
          retention-days: 7

  verify:
    needs: build
    runs-on: reekeer-linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: {repository: reekeer/sigdb-ts, ref: "${{ env.SIGDB_TS_REF }}", path: sigdb-ts}
      - uses: actions/download-artifact@v4
        with: {pattern: "cases-*", merge-multiple: true, path: cases}
      - uses: astral-sh/setup-uv@v10.2.0
        with: {python-version: "3.13"}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - uses: oven-sh/setup-bun@v2
      - name: python reads the rust and ts files
        run: |
          uv run --no-project --with "sigdb==$SIGDB_PY" python scripts/crosscheck.py --verify cases/full
          uv run --no-project --with "sigdb==$SIGDB_PY" python scripts/crosscheck.py --verify cases/portable
      - name: rust matches the python bytes and reads the python and ts files
        run: |
          cargo run --release --example crosscheck -- cases/full
          cargo run --release --example crosscheck -- cases/portable
      - name: ts reads the python and rust files
        run: |
          (cd sigdb-ts && npm ci)
          SIGDB_TS=sigdb-ts bun scripts/crosscheck-ts.ts cases/portable
